name: iOS build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build iOS app (simulator)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Launch in simulator and screenshot
        run: |
          set -e
          APP=$(find build/ios/Build/Products -name "iosApp.app" -type d | head -1)
          echo "Built app: $APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for r in d for x in d[r] if 'iPhone' in x['name']]; print(c[0]['udid'])")
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          sleep 5
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.simon.wodtimerkmp
          sleep 10
          mkdir -p artifacts
          xcrun simctl io "$UDID" screenshot artifacts/ios-home.png
          echo "Screenshot captured."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            artifacts/ios-home.png
            build/ios/Build/Products/Debug-iphonesimulator/iosApp.app
          if-no-files-found: warn
